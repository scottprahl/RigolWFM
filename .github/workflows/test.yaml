---
name: test

on:    # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # allow manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    name: Build and test

    strategy:
      matrix:
        python-version: ['3.10', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"  # editable mode with test deps

      - name: Run Python test suite
        # Everything except the notebook tests, which `make test` also skips:
        # they run JupyterLab and are far slower than the rest put together.
        run: pytest tests --ignore=tests/test_all_notebooks.py

      - name: Run JavaScript test suite
        # wfmview/app.js re-implements every format in JavaScript, so it has
        # tests of its own.  Node's built-in runner needs no dependencies.
        run: node --test wfmview/tests/*.test.js
